name: Agent evals

# Evals call the real model (a few cents per run), so they only run when agent behavior could
# have changed, or on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "src/agent/**"
      - "src/lib/restaurants/**"
      - "src/db/**"
      - "drizzle/**"
      - "scripts/eval.ts"
  pull_request:
    paths:
      - "prompts/**"
      - "src/agent/**"
      - "src/lib/restaurants/**"
      - "src/db/**"
      - "drizzle/**"
      - "scripts/eval.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Branch expiry (safety net if cleanup never runs)
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # A throwaway copy of production for this run only, so tests and evals never write to prod.
      - name: Create database branch
        id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - name: Migrate, seed, test, and run evals
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm test
          pnpm eval

      - name: Delete database branch
        if: always() && steps.branch.outputs.branch_id
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_id: ${{ steps.branch.outputs.branch_id }}
